# Zosh Food Backend Configuration
server.port=${PORT:5454}

# Database Configuration (Supports Cloud MySQL & Localhost)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zosh_food}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:$7090Ashok}

# ORM / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Payment Gateways (Razorpay & Stripe)
razorpay.api.key=${RAZORPAY_KEY:your_razorpay_api_key}
razorpay.api.secret=${RAZORPAY_SECRET:your_razorpay_secret_key}
stripe.api.key=${STRIPE_KEY:your_stripe_key}

# Email Service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:your_email}
spring.mail.password=${MAIL_PASS:your_email_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



