# Zosh Food Backend Configuration
server.port=${PORT:5454}

# Database Configuration (Runs out of the box with zero external setup!)
# Default: Embedded Database in MySQL Compatibility Mode
# Optional: Set DB_URL, DB_DRIVER, DB_USERNAME, DB_PASSWORD to connect to external MySQL
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fooddb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ORM / Hibernate (Dialect is automatically auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false

# Payment Gateways (Razorpay & Stripe)
razorpay.api.key=${RAZORPAY_KEY:your_razorpay_api_key}
razorpay.api.secret=${RAZORPAY_SECRET:your_razorpay_secret_key}
stripe.api.key=${STRIPE_KEY:your_stripe_key}

# Email Service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:your_email}
spring.mail.password=${MAIL_PASS:your_email_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



