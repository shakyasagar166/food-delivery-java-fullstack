# Zosh Food Backend Configuration
server.port=${PORT:5454}

# Database Configuration (Aiven MySQL & Cloud Deployment Ready)
# Supports both DB_* and standard SPRING_DATASOURCE_* environment variables
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-10b401fa-shakyasagar166-vinayka.b.aivencloud.com:22734/defaultdb?sslMode=REQUIRED}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:avnadmin}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# ORM / Hibernate (MySQL Dialect configured)
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Payment Gateways (Razorpay & Stripe)
razorpay.api.key=${RAZORPAY_KEY:your_razorpay_api_key}
razorpay.api.secret=${RAZORPAY_SECRET:your_razorpay_secret_key}
stripe.api.key=${STRIPE_KEY:your_stripe_key}

# Email Service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:your_email}
spring.mail.password=${MAIL_PASS:your_email_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Groq AI Chatbot Configuration
grok.api.key=${GROK_API_KEY:your_groq_api_key}
grok.api.url=${GROK_API_URL:https://api.groq.com/openai/v1/chat/completions}
grok.model=${GROK_MODEL:openai/gpt-oss-120b}
